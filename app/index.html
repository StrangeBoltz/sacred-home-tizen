<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Sacred Home</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cormorant+Garamond:300,400|Josefin+Sans:300,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="mandala">
      <div class="layer" id="l-ring"></div>
      <div class="layer" id="l-star"></div>
      <div class="layer" id="l-metatron"></div>
      <div class="layer" id="l-flower"></div>
      <div id="core"></div>
      <div id="clock"><div id="time">--:--</div><div id="date"></div></div>
    </div>

    <div id="greeting"></div>

    <div id="rows">
      <div class="row" id="row-apps"></div>
      <div class="flourish"></div>
      <div class="row small" id="row-inputs"></div>
    </div>

    <div id="hint">◇ press any key ◇</div>
    <div id="toast"></div>
  </div>

  <script src="config.js"></script>
  <script src="geometry.js"></script>
  <script src="app.js"></script>
</body>
</html>
